<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometry 1 — Trig Tools</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
.hub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:8px}
.hub-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;text-decoration:none;color:var(--text);display:block;transition:transform .15s,box-shadow .15s,border-color .15s}
.hub-card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.10);border-color:var(--accent)}
.hub-card .tag{font-family:'JetBrains Mono',monospace;font-size:.66rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.hub-card h3{font-size:1.02rem;font-weight:700;margin:6px 0 6px}
.hub-card p{font-size:.86rem;color:var(--muted);line-height:1.5}
.hub-soon{opacity:.5;pointer-events:none}
.hub-soon .tag{color:var(--muted)}
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-left"><h1>Geometry 1 — Trigonometry</h1><div class="sub">Tools &amp; Checkers</div></div>
</header>
<main class="main">
  <div class="hub-grid" id="hubGrid"></div>
</main>
<script>
var CARDS=[
 {tag:'Tool',title:'Triangle Labeler',desc:'Pick the orientation, then drag opposite / adjacent / hypotenuse / \u03B8 onto the right spots. Elevation &amp; depression practice.',href:'tools/triangle-labeler.html',status:'live'},
 {tag:'Pre-Test',title:'Trigonometry Pre-Test',desc:'Four readiness problems (balloon, lighthouse, depression, clay pigeon) with full step scaffolding.',href:'checkers/hudson-pretest.html',status:'live'},
 {tag:'Project',title:'Miracle on the Hudson',desc:'Reconstruct the flight path from real angle &amp; distance data \u2014 eight scaffolded trig problems.',href:'checkers/hudson.html',status:'live'}
];
var g=document.getElementById('hubGrid');
CARDS.forEach(function(c){
  var soon=c.status!=='live';
  var a=document.createElement('a');
  a.className='hub-card'+(soon?' hub-soon':'');
  a.href=soon?'#':c.href;
  a.innerHTML='<div class="tag">'+c.tag+(soon?' \u00b7 coming soon':'')+'</div><h3>'+c.title+'</h3><p>'+c.desc+'</p>';
  g.appendChild(a);
});
</script>
</body>
</html>
